<!DOCTYPE html>

<head>

<body>
    <div class="cabecalho">
        <div class="img_1">
            <img src="img/Pa.png" alt="">
        </div>
        <div>
            <h1>Calculadora de dosagem Dária</h1>
            <p>cauculadora para pesagem de terra</p>
        </div>
    </div>






    <div class="user_information">
        <form action="#" method="POST" class="form-information">

            <div class="campo">
                <label for="nome">Nome Completo</label>
                <input id="name" type="text" placeholder="Nome Completo" name="nome">
            </div>
            <div class="campo">
                <label for="email">E-mail</label>
                <input id="email" type="email" name="email" id="email" placeholder="Entre com seu email">
            </div>
            <div class="campo">
                <label for="birthdaytime">data:</label>
                <input id="data" type="datetime-local" name="birthdaytime">
        </form>
    </div>
    </div>





    <div class="nome_da_tua_terra">
        <form>
            <label for="Nome_da_tua_terra">Nome_da_tua_terra</label>
            <input type="text" name="" id="">
            <form>
                <input type="checkbox" id="medicamento" name="vehicle1" value="Bike">
                <label for="vehicle1"> selecionar nome padrão</label><br>
            </form>
    </div>








    <div class="pesagem_da_terra">
        <form>
            <div class="dados-dosagem">
                <div class="p_dosagem">
                    <p>Selecione a dosagem mg</p>
                </div>
                <div class="dosagem_input">

                    <div>
                        <input  id="html" name="fav_language" value="250">
                        <label for="html">250 mg</label><br>
                    </div>
                    <div>
                        <input  id="css" name="fav_language" value="500">
                        <label for="css">500 mg</label><br>
                    </div>
                    <div>
                        <input " id="javascript" name="fav_language" value="750">
                        <label for="javascript">750 mg</label>
                    </div>
                </div>
            </div>



            <div>
                <p>quantidade de dozes por dia</p>
                <input type="number" min="0" max="120" placeholder="18" id="qtd_dosagem">
            </div>
    </div>
    <div class="cauculagem">
        <button type="button" class="btn_enviar">
            CALCULAR
        </button>

    </div>




    <div class="resultado">
        <div class="blocoRes"><img src="img/bolo.jpg" alt=""></div>
        <div class="blocoRes"><img src="img/bolo.jpg" alt=""></div>
        <div class="blocoRes"><img src="img/bolo.jpg" alt=""></div>

        <script src="js/logic.js"></script>
        <script src="js/app.js"></script>
